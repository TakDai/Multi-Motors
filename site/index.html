<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Multi-Motors</title>
<meta name="description" content="Catalogue des moteurs brushless FPV : stator, KV, poids, LiPo, fixation. Mis à jour chaque jour.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!--APP-->
<div id="app">

  <!-- ============ ACCUEIL ============ -->
  <section id="view-home" class="view">
    <header class="home-head wrap">
      <h1 class="logo-title"><a href="#">Multi-Motors</a></h1>
      <label class="search-box" for="q">
        <span class="sr">Rechercher votre moteur</span>
        <input id="q" type="search" placeholder="Rechercher votre moteur" autocomplete="off">
      </label>
    </header>

    <form class="hero" id="spec-form" autocomplete="off" aria-label="Recherche par caractéristiques">
      <div class="hero-side hero-left">
        <div class="spec-field"><label class="pill" for="f-kv">KV</label><input id="f-kv" inputmode="numeric" placeholder="ex. 1900"></div>
        <div class="spec-field"><label class="pill" for="f-poids">Poids</label><input id="f-poids" inputmode="decimal" placeholder="max. g"></div>
        <div class="spec-field"><label class="pill" for="f-classe">Classe</label><input id="f-classe" placeholder="ex. 2207"></div>
        <div class="spec-field"><label class="pill" for="f-voltage">Voltage</label><input id="f-voltage" placeholder="ex. 6S"></div>
        <div class="spec-field"><label class="pill" for="f-vmax">Vitesse max</label><input id="f-vmax" inputmode="numeric" placeholder="min. tr/min"></div>
        <div class="spec-field"><label class="pill" for="f-pmax">Puissance max</label><input id="f-pmax" inputmode="numeric" placeholder="min. W"></div>
      </div>

      <div class="hero-motor" aria-hidden="true"><!--MOTOR--></div>

      <div class="hero-side hero-right">
        <div class="spec-field"><input id="f-shaft" inputmode="decimal" placeholder="ex. 5"><label class="pill" for="f-shaft">Shaft</label></div>
        <div class="spec-field"><select id="f-marque"><option value="">Toutes</option></select><label class="pill" for="f-marque">Marque</label></div>
        <div class="spec-field spec-duo"><input id="f-dmot" inputmode="decimal" placeholder="Ø max"><input id="f-hmot" inputmode="decimal" placeholder="H max" aria-label="Hauteur moteur max"><label class="pill" for="f-dmot">Dimensions</label></div>
        <div class="spec-field"><input id="f-config" placeholder="ex. 12N14P"><label class="pill" for="f-config">Configuration</label></div>
        <div class="spec-field"><input id="f-entraxe" placeholder="ex. 16x16"><label class="pill" for="f-entraxe">Entraxe fixation</label></div>
        <div class="spec-field"><input id="f-helice" placeholder='ex. 5"'><label class="pill" for="f-helice">Hélice recommandée</label></div>
      </div>
      <button type="reset" class="reset-link" id="reset">Effacer les critères</button>
    </form>

    <a class="chevron" href="#liste" aria-label="Voir les moteurs"><svg viewBox="0 0 40 20"><path d="M4 4l16 12L36 4" fill="none" stroke="currentColor" stroke-width="3"/></svg></a>

    <section class="list wrap" id="liste" aria-label="Moteurs">
      <div class="tabs-bar">
        <div class="tabs" role="tablist">
          <button role="tab" class="tab" data-tab="populaire" aria-selected="true">Populaire</button>
          <button role="tab" class="tab" data-tab="nouveautes" aria-selected="false">Nouveautés</button>
          <button role="tab" class="tab" data-tab="tous" aria-selected="false">Tous</button>
        </div>
        <label class="sort"><span class="sr">Trier</span>
          <select id="sort">
            <option value="">Trier</option>
            <option value="kv-asc">KV croissant</option>
            <option value="kv-desc">KV décroissant</option>
            <option value="poids-asc">Poids croissant</option>
            <option value="classe">Classe</option>
            <option value="marque">Marque</option>
          </select>
        </label>
      </div>
      <p class="count" id="count" aria-live="polite"></p>
      <div id="rows"></div>
      <button class="more" id="more" type="button" hidden>Afficher plus</button>
      <p class="empty" id="empty" hidden>Aucun moteur ne correspond à ces critères.</p>
    </section>

    <footer class="foot wrap">
      <p>Données relevées sur les sites des fabricants et des boutiques FPV, mises à jour chaque jour. Vérifiez la fiche officielle avant achat.</p>
    </footer>
  </section>

  <!-- ============ FICHE MOTEUR ============ -->
  <section id="view-detail" class="view" hidden>
    <div class="wrap">
      <a class="back" href="#">← Tous les moteurs</a>
      <div id="detail"></div>
    </div>
  </section>

</div>
<!--/APP-->
<script src="assets/app.js"></script>
</body>
</html>
