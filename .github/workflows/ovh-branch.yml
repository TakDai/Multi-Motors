name: Site prêt pour OVH (branche ovh)

# Construit le site tel qu'il doit être servi (contenu de site/ + data/moteurs.csv)
# et le pousse sur la branche "ovh". L'hébergement OVH est associé à cette branche
# (Hébergements > Sites internet > Associer Git) : son webhook récupère chaque mise à jour.
on:
  # Après chaque recherche quotidienne (ses commits ne déclenchent pas "push")
  workflow_run:
    workflows: ["Recherche quotidienne des nouveaux moteurs"]
    types: [completed]
  push:
    branches: [Moteurs]
    paths: ["site/**", "pages/**", "catalogue/moteurs.csv", "tools/seo_pages.py", ".github/workflows/ovh-branch.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ovh-branch
  cancel-in-progress: true

jobs:
  build:
    # Après la recherche quotidienne, même marquée en échec : ce qu'elle a pu publier est mis en ligne
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Préparer les fichiers du site
        run: |
          mkdir -p build/data
          cp -r site/. build/
          cp catalogue/moteurs.csv build/data/moteurs.csv
          rm -f build/api/config.php
          # La configuration de la base (api/config.php) se dépose une fois sur l'hébergement, jamais dans Git
          printf 'api/config.php\n' > build/.gitignore
          printf 'Site Multi-Motors prêt à servir, généré automatiquement depuis la branche %s (%s).\nNe pas modifier ici : les changements sont écrasés à chaque mise à jour.\n' \
            "${{ github.event.repository.default_branch }}" "$(git rev-parse --short HEAD)" > build/LISEZMOI.txt

      - name: Pages pour Google (une par modèle, marque, classe et taille) et sitemap
        env:
          # Codes de vérification Search Console / Bing Webmaster Tools (Settings > Secrets and variables > Actions > Variables)
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: |
          # Dates de dernière modification des pages : reprises de la version en ligne (branche ovh)
          git fetch -q --depth 1 origin ovh && git show FETCH_HEAD:data/seo-etat.json > build/data/seo-etat.json 2>/dev/null || true
          python3 tools/seo_pages.py build

      - name: Versionner les feuilles de style et scripts
        # assets/style.css -> assets/style.css?v=<empreinte> : navigateurs et téléphones chargent la nouvelle version dès qu'un fichier change
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re
          b = pathlib.Path("build")
          v = lambda m: m.group(1) + "?v=" + hashlib.md5((b / m.group(1).lstrip("/")).read_bytes()).hexdigest()[:10] if (b / m.group(1).lstrip("/")).is_file() else m.group(1)
          n = 0
          for f in b.rglob("*.html"):
              s = f.read_text(encoding="utf-8")
              t = re.sub(r'(?<=")(/?assets/[\w.-]+\.(?:css|js))(?=")', v, s)
              if t != s:
                  f.write_text(t, encoding="utf-8"); n += 1
          print(n, "pages mises à jour")
          PY

      - name: Pousser sur la branche ovh
        # Historique conservé (pas de push forcé) : OVH met à jour son dossier par un simple "pull"
        run: |
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$REPO" ovh >/dev/null; then
            git clone -q --depth 1 --branch ovh "$REPO" out
          else
            mkdir out && git -C out init -q -b ovh && git -C out remote add origin "$REPO"
          fi
          find out -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r build/. out/
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Rien de nouveau à publier."; exit 0; fi
          git commit -q -m "Site du $(date -u +%F) ($(git -C .. rev-parse --short HEAD))"
          git push -q origin ovh

      - name: Prévenir Bing, Qwant, DuckDuckGo et Yandex des pages modifiées (IndexNow)
        # Google lit le sitemap (dates de modification à jour) ; IndexNow ne le concerne pas
        continue-on-error: true
        run: |
          [ -s indexnow-urls.txt ] || { echo "Aucune page modifiée."; exit 0; }
          sleep 120   # le temps qu'OVH récupère la nouvelle version
          KEY=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import seo_pages; print(seo_pages.INDEXNOW_KEY)")
          head -n 10000 indexnow-urls.txt | python3 -c "import json, sys; print(json.dumps({'host': 'multi-motors.fr', 'key': '$KEY', 'keyLocation': 'https://multi-motors.fr/$KEY.txt', 'urlList': [l.strip() for l in sys.stdin if l.strip()]}))" > indexnow.json
          echo "$(wc -l < indexnow-urls.txt) pages signalées"
          curl -sS -o /dev/null -w "IndexNow : HTTP %{http_code}\n" -H "Content-Type: application/json; charset=utf-8" --data @indexnow.json https://api.indexnow.org/indexnow
