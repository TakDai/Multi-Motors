name: Recherche quotidienne des nouveaux moteurs

on:
  schedule:
    # Tous les jours à 06:00 UTC (08:00 heure de Paris en été)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nouveaux-moteurs
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: multi_motors_ai/requirements.txt

      - name: Installer les dépendances
        run: pip install -r multi_motors_ai/requirements.txt

      - name: Importer le tableau Google (nouveaux moteurs, prix, corrections du jour)
        env:
          SHEET_ID: 1uuWtvCLQR6indriPs9R-HOwTxC6j2XXDpQrLytxXl1c
        run: |
          curl -sSfL -o tableau.xlsx "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx"
          python tools/import_sheet.py tableau.xlsx
          rm -f tableau.xlsx

      - name: Rechercher les nouveaux moteurs
        env:
          REQUEST_DELAY_MIN: "1"
          REQUEST_DELAY_MAX: "3"
        run: python -m multi_motors_ai.main --once --output github

      - name: Compléter les fiches (500 familles par jour)
        run: python tools/enrich.py --limit 500 || true

      - name: Corrections validées par la communauté
        env:
          MM_SITE_URL: ${{ secrets.MM_SITE_URL }}
          MM_EXPORT_KEY: ${{ secrets.MM_EXPORT_KEY }}
        run: python tools/community_sync.py || true

      - name: Prix, photos et vidéos (400 familles par jour, toutes les boutiques)
        run: |
          python tools/prices.py --limit 400 --workers 6 || true
          python tools/videos.py --limit 300 || true
          python tools/photos.py || true
          python tools/photos_sites.py || true
          python tools/photos_dedupe.py || true

      - name: Miniatures et fil d'actualité
        run: |
          python tools/thumbs.py || true
          python tools/logos.py || true
          python tools/actus.py || true

      - name: Uniformiser le format des caractéristiques
        run: python tools/normalize.py

      - name: Publier sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/ site/assets/motors site/assets/logos site/data
          if git diff --cached --quiet; then
            echo "Aucun nouveau moteur aujourd'hui."
            exit 0
          fi
          git commit -m "catalogue: nouveaux moteurs du $(date -u +%Y-%m-%d)"
          git push

      - name: Conserver le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-${{ github.run_id }}
          path: multi_motors_ai.log
          if-no-files-found: ignore
