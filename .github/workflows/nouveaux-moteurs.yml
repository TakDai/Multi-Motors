name: Recherche quotidienne des nouveaux moteurs

on:
  schedule:
    # GitHub lance les tâches programmées avec du retard (jusqu'à 6 h à l'heure pile, très demandée) :
    # trois horaires décalés du matin (heure de Paris en été : 5 h 23, 6 h 53, 8 h 37) ;
    # le premier qui démarre fait la recherche, les suivants voient qu'elle est faite et s'arrêtent.
    - cron: "23 3 * * *"
    - cron: "53 4 * * *"
    - cron: "37 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: nouveaux-moteurs
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.c.outputs.run }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lancement à la main : toujours ; programmé : seulement si aucune recherche n'a réussi aujourd'hui
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh run list -R "${{ github.repository }}" --workflow nouveaux-moteurs.yml --status success --created "$(date -u +%F)" --json databaseId --jq length)
          echo "Recherches réussies aujourd'hui : $n"
          if [ "$n" = "0" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  scan:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Importer le tableau Google (nouveaux moteurs, prix, corrections du jour)
        env:
          SHEET_ID: 1uuWtvCLQR6indriPs9R-HOwTxC6j2XXDpQrLytxXl1c
        run: |
          curl -sSfL -o tableau.xlsx "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx"
          python tools/import_sheet.py tableau.xlsx
          rm -f tableau.xlsx

      - name: Moteurs vendus en boutique qui manquent au catalogue
        run: tools/etape.sh python tools/shop_motors.py

      - name: Fiches techniques des sites fabricants (T-Motor…)
        run: tools/etape.sh python tools/maker_sheets.py

      - name: Compléter les fiches (500 familles par jour)
        run: tools/etape.sh python tools/enrich.py --limit 500

      - name: Corrections validées par la communauté
        env:
          MM_SITE_URL: ${{ secrets.MM_SITE_URL }}
          MM_EXPORT_KEY: ${{ secrets.MM_EXPORT_KEY }}
        run: tools/etape.sh python tools/community_sync.py

      - name: Prix, photos et vidéos (400 familles par jour, toutes les boutiques)
        run: |
          tools/etape.sh python tools/prices.py --limit 400 --workers 6
          tools/etape.sh python tools/videos.py --limit 300
          tools/etape.sh python tools/photos.py
          tools/etape.sh python tools/photos_sites.py
          tools/etape.sh python tools/photos_dedupe.py
          tools/etape.sh python tools/photos_frame.py
          tools/etape.sh python tools/links_check.py
          tools/etape.sh python tools/bench.py

      - name: Miniatures et fil d'actualité
        run: |
          tools/etape.sh python tools/thumbs.py
          tools/etape.sh python tools/ranking.py
          tools/etape.sh python tools/logos.py
          tools/etape.sh python tools/actus.py

      - name: Uniformiser le format des caractéristiques
        run: tools/etape.sh python tools/normalize.py

      - name: Publier sur GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/ site/assets/motors site/assets/logos site/data
          if git diff --cached --quiet; then
            echo "Aucun nouveau moteur aujourd'hui."
            exit 0
          fi
          git commit -q -m "catalogue: nouveaux moteurs du $(date -u +%Y-%m-%d)"
          # The branch may have moved during the run (a merged pull request): replay on top, the new data wins
          for i in 1 2 3; do
            git pull --rebase -X theirs origin Moteurs && git push && exit 0
            sleep 10
          done
          exit 1

      - name: Bilan
        if: always()
        run: |
          {
            echo "## Recherche du $(date -u +%F)"
            git log -1 --format='Dernière publication : %s (%cr)' origin/Moteurs 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/echecs.md" ]; then echo "### Outils en échec"; cat "$RUNNER_TEMP/echecs.md"; else echo "Tous les outils ont fonctionné."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Run marked failed (red, email from GitHub) when a tool crashed, after its data was published
          [ ! -s "$RUNNER_TEMP/echecs.md" ]
